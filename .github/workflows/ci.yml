name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/battlefield_test
      FEISHU_APP_ID: ""
      FEISHU_APP_SECRET: ""
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: battlefield_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlefield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public repository boundary
        run: pnpm check:public

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify PostgreSQL migrations and tenant query
        run: pnpm --filter @battlefield/database test:postgres

      - name: Verify PostgreSQL action reminder and inbox flow
        run: pnpm --filter @battlefield/worker test:postgres

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
